# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  test-issue-detection:
    name: 'Test issue tracker detection'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Checkout repository; test commits are local only
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Setup test commit with issue tracker'
        run: |
          git config user.name 'GitHub Actions Test'
          git config user.email 'actions@github.com'
          echo '# Test Documentation' > test-detection.md
          git add test-detection.md
          git commit -m "docs: Add test documentation

          This commit includes an issue tracker reference.

          Issue-ID: TEST-456"

      - name: 'Test detection of existing issue tracker'
        uses: $/
        id: test-detection
        with:
          issue_id_lookup_json: >-
            [
              {"key": "${{ github.actor }}", "value": "FALLBACK-001"},
              {"key": "dependabot[bot]", "value": "MAINT-001"}
            ]
          inject: false

      - name: 'Verify issue tracker was detected'
        run: |
          if [ "${STEPS_TEST_DETECTION_OUTPUTS_PRESENT}" != "true" ]; then
            echo '❌ Failed to detect existing issue tracker'
            exit 1
          fi
          echo '✅ Issue tracker detection test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_DETECTION_OUTPUTS_PRESENT: ${{ steps.test-detection.outputs.present }}

  test-custom-string:
    name: 'Test custom issue string'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Checkout repository; test commits are local only
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Setup test commit with custom issue format'
        run: |
          git config user.name 'GitHub Actions Test'
          git config user.email 'actions@github.com'
          echo '# Custom Format Test' > test-custom.md
          git add test-custom.md
          git commit -m "feat: Add custom format support

          This commit uses a custom issue tracker format.

          Ticket-ID: CUSTOM-789"

      - name: 'Test custom issue string detection'
        uses: $/
        id: test-custom
        with:
          issue_id_lookup_json: '[{"key": "test", "value": "FALLBACK-999"}]'
          issue_string: 'Ticket-ID:'
          inject: false

      - name: 'Verify custom string was detected'
        run: |
          if [ "${STEPS_TEST_CUSTOM_OUTPUTS_PRESENT}" != "true" ]; then
            echo '❌ Failed to detect custom issue string format'
            exit 1
          fi
          echo '✅ Custom issue string test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_CUSTOM_OUTPUTS_PRESENT: ${{ steps.test-custom.outputs.present }}

  test-missing-issue:
    name: 'Test missing issue handling'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Checkout repository; test commits are local only
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Setup test commit without issue tracker'
        run: |
          git config user.name 'GitHub Actions Test'
          git config user.email 'actions@github.com'
          echo '# No Issue Test' > test-no-issue.md
          git add test-no-issue.md
          git commit -m "fix: Update configuration

          This commit does not include an issue tracker reference."

      - name: 'Test missing issue detection (check mode)'
        uses: $/
        id: test-missing
        with:
          issue_id_lookup_json: >-
            [
              {"key": "${{ github.actor }}", "value": "FOUND-123"},
              {"key": "test-user", "value": "TEST-456"}
            ]
          inject: false

      - name: 'Verify missing issue was detected'
        run: |
          if [ "${STEPS_TEST_MISSING_OUTPUTS_PRESENT}" == 'true' ]; then
            echo '❌ Should not have found issue tracker'
            exit 1
          fi
          echo '✅ Missing issue detection test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_MISSING_OUTPUTS_PRESENT: ${{ steps.test-missing.outputs.present }}

  test-error-handling:
    name: 'Test error scenarios'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Checkout repository; test commits are local only
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The commit carries an issue tracker reference, so a lookup table
      # that passes validation never reaches the lookup or the push; each
      # rejection below can only come from the validation step
      - name: 'Setup test commit for error testing'
        run: |
          git config user.name 'GitHub Actions Test'
          git config user.email 'actions@github.com'
          echo '# Error Test' > test-error.md
          git add test-error.md
          git commit -m "test: Error handling scenario

          Issue-ID: TEST-000"

      - name: 'Test with invalid JSON'
        uses: $/
        id: test-invalid-json
        continue-on-error: true
        with:
          issue_id_lookup_json: 'invalid json format here'
          inject: true

      - name: 'Verify invalid JSON was rejected'
        run: |
          if [ "${STEPS_TEST_INVALID_JSON_OUTCOME}" == 'success' ]; then
            echo '❌ Should have failed with invalid JSON'
            exit 1
          fi
          if [ "${STEPS_TEST_INVALID_JSON_ERROR}" != 'invalid-json' ]; then
            echo "❌ Wrong error: '${STEPS_TEST_INVALID_JSON_ERROR}'"
            exit 1
          fi
          echo '✅ Invalid JSON handling test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_INVALID_JSON_OUTCOME: ${{ steps.test-invalid-json.outcome }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_INVALID_JSON_ERROR: ${{ steps.test-invalid-json.outputs.error }}

      # Valid JSON, but the object form json-key-value-lookup-action cannot
      # read; this README formerly documented it
      - name: 'Test with a JSON object instead of an array'
        uses: $/
        id: test-object-json
        continue-on-error: true
        with:
          issue_id_lookup_json: '{"valid": "TEST-000"}'
          inject: true

      - name: 'Verify JSON object was rejected'
        run: |
          if [ "${STEPS_TEST_OBJECT_JSON_OUTCOME}" == 'success' ]; then
            echo '❌ Should have failed with a JSON object'
            exit 1
          fi
          if [ "${STEPS_TEST_OBJECT_JSON_ERROR}" != 'invalid-format' ]; then
            echo "❌ Wrong error: '${STEPS_TEST_OBJECT_JSON_ERROR}'"
            exit 1
          fi
          echo '✅ JSON object handling test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_OBJECT_JSON_OUTCOME: ${{ steps.test-object-json.outcome }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_OBJECT_JSON_ERROR: ${{ steps.test-object-json.outputs.error }}

      - name: 'Test with an array element missing its value'
        uses: $/
        id: test-missing-value
        continue-on-error: true
        with:
          issue_id_lookup_json: '[{"key": "valid"}]'
          inject: true

      - name: 'Verify incomplete array element was rejected'
        run: |
          if [ "${STEPS_TEST_MISSING_VALUE_OUTCOME}" == 'success' ]; then
            echo '❌ Should have failed with an element missing its value'
            exit 1
          fi
          if [ "${STEPS_TEST_MISSING_VALUE_ERROR}" != 'invalid-format' ]; then
            echo "❌ Wrong error: '${STEPS_TEST_MISSING_VALUE_ERROR}'"
            exit 1
          fi
          echo '✅ Incomplete array element test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_MISSING_VALUE_OUTCOME: ${{ steps.test-missing-value.outcome }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_MISSING_VALUE_ERROR: ${{ steps.test-missing-value.outputs.error }}

      - name: 'Test with whitespace-only input'
        uses: $/
        id: test-blank-json
        continue-on-error: true
        with:
          issue_id_lookup_json: '   '
          inject: true

      - name: 'Verify whitespace-only input was rejected'
        run: |
          if [ "${STEPS_TEST_BLANK_JSON_OUTCOME}" == 'success' ]; then
            echo '❌ Should have failed with whitespace-only input'
            exit 1
          fi
          if [ "${STEPS_TEST_BLANK_JSON_ERROR}" != 'invalid-json' ]; then
            echo "❌ Wrong error: '${STEPS_TEST_BLANK_JSON_ERROR}'"
            exit 1
          fi
          echo '✅ Whitespace-only input test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_BLANK_JSON_OUTCOME: ${{ steps.test-blank-json.outcome }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_BLANK_JSON_ERROR: ${{ steps.test-blank-json.outputs.error }}

      - name: 'Test successful scenario for comparison'
        uses: $/
        id: test-valid
        continue-on-error: true
        with:
          issue_id_lookup_json: '[{"key": "valid", "value": "TEST-000"}]'
          inject: true

      - name: 'Verify valid input works'
        run: |
          if [ "${STEPS_TEST_VALID_OUTCOME}" != 'success' ]; then
            echo "❌ Valid input failed: '${STEPS_TEST_VALID_ERROR}'"
            exit 1
          fi
          if [ -n "${STEPS_TEST_VALID_ERROR}" ]; then
            echo "❌ Unexpected error: '${STEPS_TEST_VALID_ERROR}'"
            exit 1
          fi
          if [ "${STEPS_TEST_VALID_PRESENT}" != 'true' ]; then
            echo '❌ Failed to detect existing issue tracker'
            exit 1
          fi
          echo '✅ Valid input test passed'
          echo '✅ All error handling tests completed'
        env:
          STEPS_TEST_VALID_OUTCOME: ${{ steps.test-valid.outcome }}
          STEPS_TEST_VALID_ERROR: ${{ steps.test-valid.outputs.error }}
          STEPS_TEST_VALID_PRESENT: ${{ steps.test-valid.outputs.present }}
